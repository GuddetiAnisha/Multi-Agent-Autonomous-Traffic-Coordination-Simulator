[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-coordination"
version = "0.1.0"
description = "Mesa simulator for mixed industrial traffic coordination"
requires-python = ">=3.11"
dependencies = ["mesa==3.3.1"]

[project.scripts]
traffic-sim = "traffic_sim.cli:main"
traffic-dashboard = "traffic_sim.dashboard:main"

[tool.setuptools.packages.find]
include = ["traffic_sim*"]
